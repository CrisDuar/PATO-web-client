<app-navbar-prelogin></app-navbar-prelogin>

<div class="card-container">
  <mat-card appearance="outlined">
    <mat-card-content>
      <div class="custom-card-header">
        <h1 class="login-title">Iniciar sesión</h1>
        <div class="subtext-container">
          <p>¿No tienes una cuenta?</p>
          <a routerLink="/register" class="forgot-password-link">Crea una justo ahora</a>
        </div>
      </div>
      <mat-form-field class="input-custom" appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput [formControl]="emailControl">
      </mat-form-field>
      <mat-form-field class="input-custom" appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hide() ? 'password' : 'text'" [formControl]="passwordControl" />
        <button matIconButton matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()">
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
      <div class="flex">
        <button type="button" matButton="filled" class="submit-container" (click)="login()">Iniciar Sesión</button>
      </div>
      <div class="flex">
        <a routerLink="/accountRecovery" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
