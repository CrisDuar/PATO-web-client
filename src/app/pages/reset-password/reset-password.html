<div class="card">
    <h1>Ingresar código de verificación</h1>
    <p>El código de verificiacion ha sido enviado a su correo</p>

    @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
    }

    <app-otp-input (codeChange)="otpCode.set($event)"></app-otp-input>
    <mat-action-list>
        <mat-form-field appearance="outline">
        <mat-label>Contraseña nueva</mat-label>
        <input matInput type="password" [formControl]="newPassword">
        @if (newPassword.invalid) {
        <mat-error>{{ errorMessage() }}</mat-error>
        }
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Repetir contraseña nueva</mat-label>
        <input matInput type="password" [formControl]="confirmPassword">
    </mat-form-field>

    </mat-action-list>
    <div class="flex">
        <button type="button" matButton="filled" class="submit-container" (click)="onVerifyToken()">Enviar</button>
    </div>
</div>
