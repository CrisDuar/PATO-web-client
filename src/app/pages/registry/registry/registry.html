<app-navbar-prelogin></app-navbar-prelogin>
<div class="main-container flex min-h-screen">
  <div class="flex-1/3 border-r-2 border-gray-200"></div>
  <div class="flex-1 border-l-0 flex items-center justify-around p-3">
    <div class="w-full max-w-sm">
      <h2 class="text-2xl font-bold mb-6">Registrar cuenta</h2>
      <form class="flex flex-col gap-4">
        <input type="email" placeholder="Correo electronico"
               [value]="emailCampo()"
               (input)="emailCampo.set(txtEmail.value)"
               (change)="emailCampo.set(txtEmail.value)"
               #txtEmail
               class="border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">
        <input type="password" placeholder="Contraseña"
               [value]="passwordCampo()"
               (input)="passwordCampo.set(txtPassword.value)"
               (change)="passwordCampo.set(txtPassword.value)"
               #txtPassword
               class="border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">

        <input type="password" placeholder="Repetir contraseña"
               [value]="passwordConfirmacionCampo()"
               (input)="passwordConfirmacionCampo.set(txtPasswordConfirmation.value)"
               (change)="passwordConfirmacionCampo.set(txtPasswordConfirmation.value);"
               #txtPasswordConfirmation
               class="border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">

        <label class="flex items-center gap-2 text-sm text-gray-500">
          <input type="checkbox" class="accent-purple-500">
          Acepto <a href="#" class="text-teal-500">terminos y condiciones</a>
        </label>
        @if (passwordsNoCoinciden()) {
          <p class="text-red-500 text-sm">CONTRASEÑAS NO COINCIDEN</p>
        }
        @if (passwordsNoRequisitos()) {
          <p class="text-red-500 text-sm">CONTRASEÑA NO CUMPLE CON LOS REQUISITOS</p>
        }
        <button
                (click)="registrarCuenta()"
                type="submit"
                class="bg-teal-400 hover:bg-teal-500 text-black font-semibold rounded-full py-2 mt-2 transition">
          Registrar cuenta
        </button>

        <a href="#" class="text-center text-sm font-semibold text-black mt-1">Iniciar sesión</a>
      </form>
    </div>
  </div>
</div>
