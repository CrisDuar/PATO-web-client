<div class="main-container flex min-h-screen">
  <div class="flex-1 border-r-2 border-gray-200"></div>
  <div class="flex-1 border-l-0 flex items-center justify-around p-3">
    <div class="w-full max-w-sm">
      <h2 class="text-2xl font-bold mb-6">Registrar cuenta</h2>
      <form class="flex flex-col gap-4">
        <input type="email" placeholder="Correo electronico"
               class="border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">

        <input type="password" placeholder="Contraseña"
               class="border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">

        <input type="password" placeholder="Repetir contraseña"
               class="border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">

        <label class="flex items-center gap-2 text-sm text-gray-500">
          <input type="checkbox" class="accent-purple-500">
          Acepto <a href="#" class="text-teal-500">terminos y condiciones</a>
        </label>

        <button type="submit"
                class="bg-teal-400 hover:bg-teal-500 text-black font-semibold rounded-full py-2 mt-2 transition">
          Registrar cuenta
        </button>

        <a href="#" class="text-center text-sm font-semibold text-black mt-1">Iniciar sesión</a>
      </form>
    </div>
  </div>
</div>
