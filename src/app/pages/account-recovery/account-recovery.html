<div class="flex justify-center pt-16 px-4">
  <form (ngSubmit)="onSubmit()" #form="ngForm" class="w-full max-w-[342px] text-center">
    <h1 class="text-3xl font-extrabold text-neutral-900 mb-4">
      Encuentra tu cuenta
    </h1>

    <p class="text-sm text-neutral-600 leading-snug mb-6">
      Ingresa tu correo electronico vinculado a tu cuenta
    </p>

    <input
      type="email"
      name="email"
      placeholder="Correo electronico"
      [(ngModel)]="email"
      required
      class="w-full px-4 py-3 rounded-full border border-neutral-400 text-sm
             placeholder:text-neutral-400 outline-none
             focus:border-teal-800 transition-colors"
    />

    <button
      type="submit"
      [disabled]="!form.valid"
      class="w-full mt-6 py-3 rounded-full bg-teal-300 text-neutral-900
             text-[15px] font-bold transition-opacity
             disabled:opacity-60 disabled:cursor-not-allowed
             enabled:hover:opacity-90"
    >
      Continuar
    </button>
  </form>
</div>
