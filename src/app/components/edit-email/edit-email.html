<mat-action-list class="list-edit-profile">
    <mat-form-field appearance="outline">
        <mat-label>Contraseña actual</mat-label>
        <input matInput type="password" [formControl]="currentPassword">
    </mat-form-field>
    <mat-form-field appearance="outline">
        <input matInput type="text" [formControl]="emailControl" required />

        @if (emailControl.hasError('required')) {
        <mat-error>Es obligatorio llenar el campo</mat-error>
        }

        @if (emailControl.hasError('email')) {
        <mat-error>Introduce un correo válido</mat-error>
        }

    </mat-form-field>
    <div class="container-btn-action">
        <button (click)="onSave()" class="btn-action" matButton="filled" cdkFocusInitial>Guardar</button>
    </div>
</mat-action-list>
