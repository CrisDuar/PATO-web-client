<aside class="w-64 h-full bg-white border-r border-gray-200 p-4 overflow-y-auto">
  <div class="p-4 border-b border-gray-200">
    <p class="sidebar-title">Filtrar por indicador</p>
  </div>

  <select
    [value]="location()?.pais ?? ''"
    (change)="onCountryChange($any($event.target).value || null)"
  >
    <option value="">Seleccione país</option>

    @for (country of paises(); track country) {
      <option [value]="country">{{ country }}</option>
    }
  </select>

  @if (location()?.pais === 'Colombia') {
    @switch (status()) {
      @case ('loading') {
        <p>Cargando regiones...</p>
      }

      @case ('error') {
        <p class="error">{{ locationService.error() }}</p>
      }

      @case ('loaded') {
        <select
          [value]="location()?.region ?? ''"
          (change)="onRegionChange($any($event.target).value || null)"
        >
          <option value="">Todas las regiones</option>

          @for (region of regions(); track region) {
            <option [value]="region">{{ region }}</option>
          }
        </select>

        @if (departamentos().length) {
          <select
            [value]="location()?.departamento ?? ''"
            (change)="onDepartmentChange($any($event.target).value || null)"
          >
            <option value="">Seleccione departamento</option>

            @for (department of departamentos(); track department.code) {
              <option [value]="department.code">
                {{ department.name }}
              </option>
            }
          </select>
        }
      }
    }
  }
</aside>
