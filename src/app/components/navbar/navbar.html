
<div>
<mat-toolbar>
    <img src="white_logo.webp" alt="Logo" width="80px">

    <span class="spacer"></span>

    <div class="nav-container">
        <a mat-button routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" routerLink="/map-viewer">Mapa</a>
        <a mat-button routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" routerLink="/chat-bot">ChatBOT</a>
        <a mat-button routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" routerLink="/prediction-viewer">Predicciones</a>

    </div>

    <span class="spacer"></span>


    <button matIconButton [matMenuTriggerFor]="menu">
        <div class="account-icon">
            <mat-icon class="navbar-icon" aria-label="Account icon" fontIcon="account_circle"></mat-icon>
        </div>
    </button>

    <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="openEditProfile()">Datos personales</button>
        <button mat-menu-item>Cerrar sesión</button>
    </mat-menu>


</mat-toolbar>
</div>
